name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # @azure/msal-node-extensions loads keytar at import time, which needs
      # libsecret on Linux. Without it every test file that reaches the auth
      # modules fails to import. macOS and Windows use Keychain/DPAPI instead.
      - run: sudo apt-get update && sudo apt-get install -y libsecret-1-0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build container image
        run: docker build --tag defender-xdr-mcp:ci .
      - name: Verify container runtime
        shell: bash
        run: |
          set -euo pipefail
          container_name="defender-xdr-mcp-ci"
          expected_version="$(node -p "require('./package.json').version")"

          cleanup() {
            status=$?
            trap - EXIT
            if [[ $status -ne 0 ]]; then
              docker logs "$container_name" || true
            fi
            docker rm --force "$container_name" >/dev/null 2>&1 || true
            exit "$status"
          }
          trap cleanup EXIT

          docker run --detach \
            --name "$container_name" \
            --read-only \
            --tmpfs /tmp \
            --publish 127.0.0.1:3020:3020 \
            --env DXM_TENANT_ID=11111111-1111-4111-8111-111111111111 \
            --env DXM_CLIENT_ID=22222222-2222-4222-8222-222222222222 \
            --env DXM_CLIENT_SECRET=container-startup-probe-only \
            --env DXM_PUBLIC_URL=http://127.0.0.1:3020 \
            --env DXM_HTTP_HOST=0.0.0.0 \
            defender-xdr-mcp:ci

          response=""
          for _ in {1..30}; do
            if response="$(curl --fail --silent --show-error http://127.0.0.1:3020/healthz)"; then
              break
            fi
            sleep 1
          done

          [[ "$response" == "{\"version\":\"$expected_version\"}" ]]
          [[ "$(docker exec "$container_name" whoami)" == "node" ]]
