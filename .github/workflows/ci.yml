name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # @azure/msal-node-extensions loads keytar at import time, which needs
      # libsecret on Linux. Without it every test file that reaches the auth
      # modules fails to import. macOS and Windows use Keychain/DPAPI instead.
      - run: sudo apt-get update && sudo apt-get install -y libsecret-1-0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
